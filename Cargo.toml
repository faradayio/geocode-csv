[package]
name = "geocode-csv"
version = "1.4.1-alpha.1"
authors = ["Eric Kidd <git@randomhacks.net>", "Seamus Abshere <seamus@abshere.net>"]
edition = "2021"

description = "CLI tool to bulk geocode CSV data using the Smarty API or libpostal"
license = "Apache-2.0 OR MIT"
readme = "README.md"
repository = "https://github.com/faradayio/geocode-csv"
documentation = "https://github.com/faradayio/geocode-csv"

[dev-dependencies]
cli_test_dir = "^0.1.8"
reqwest = { version = "^0.13.4", default-features = false, features = ["blocking", "json", "rustls"] }

[dependencies]
anyhow = { version = "^1.0.104", features = ["backtrace"] }
async-trait = "^0.1.92"
axum = { version = "^0.8.9", default-features = false, features = [
    "http1",
    "tokio",
    "tower-log",
    "tracing",
    "json",
] }
bb8 = "^0.9.1"
bb8-redis = "^0.26.0"
bigtable_rs = "^0.4.1"
googleapis-tonic-google-bigtable-v2 = "0.39.0"
# bincode 3.0.0 on crates.io is a tombstone that only emits compile_error!.
bincode = { version = "2.0.1", features = ["serde"] }
clap = { version = "^4.6.6", features = ["derive", "wrap_help"] }
csv = "^1.4.0"
futures = "^0.3.34"
leaky-bucket = "^1.1.2"
libpostal-rust = { version = "0.1.1", path = "crates/libpostal-rust" }
metrics = "^0.24.6"
metrics-util = "^0.20.4"
opinionated_metrics = { version = "0.2.0", path = "crates/opinionated_metrics" }
reqwest = { version = "^0.13.4", default-features = false, features = ["json", "rustls"] }
redis = { version = "^1.6.0", default-features = false, features = [
    "aio",
    "tokio-comp",
] }
rustls = { version = "^0.23", default-features = false, features = ["aws-lc-rs"] }
serde = { version = "^1.0.229", features = ["derive"] }
# IMPORTANT: We require `preserve_order` to correctly handle "structure" JSON
# specifications in a way that puts the right data in the right output columns.
serde_json = { version = "^1.0.151", features = ["preserve_order"] }
sha2 = "^0.11.0"
strum = { version = "^0.28.0", features = ["derive"] }
tokio = { version = "^1.53.1", features = [
    "io-util",
    "macros",
    "rt-multi-thread",
    "sync",
] }
tokio-stream = "^0.1.19"
tracing = "^0.1.44"
tracing-subscriber = { version = "^0.3.23", features = ["env-filter"] }
url = "^2.5.8"

[target.'cfg(not(target_env = "msvc"))'.dependencies]
tikv-jemallocator = { version = "^0.7.0", features = ["profiling"], optional = true }

# [profile.release]
# debug = true
# split-debuginfo = "off"

[workspace]
members = [
    "crates/libpostal-sys",
    "crates/libpostal-rust",
    "crates/metrics-exporter-newrelic",
    "crates/opinionated_metrics",
]
