[package]
name = "metrics-exporter-newrelic"
version = "0.2.1"
authors = ["Eric Kidd <git@randomhacks.net>", "Seamus Abshere <seamus@abshere.net>"]
edition = "2021"

description = "Basic `metrics` exporter for use with NewRelic"
license = "Apache-2.0 OR MIT"
readme = "README.md"
homepage = "https://github.com/faradayio/geocode-csv/tree/main/crates/metrics-exporter-newrelic"
repository = "https://github.com/faradayio/geocode-csv"
documentation = "https://docs.rs/metrics-exporter-newrelic"

[dependencies]
http = "1.5.0"
metrics = "0.24.6"
metrics-util = "0.20.4"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", default-features = false, features = ["sync"] }
tracing = "0.1.44"
