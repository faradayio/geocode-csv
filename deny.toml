# Project policies.
#
# These policies can be enforced using `cargo deny check`.

[advisories]
version = 2
ignore = [
    # 3.0.0 is a tombstone that only emits compile_error!. 2.0.1 is the last
    # real release, and our cache payload format is encoded with it.
    { id = "RUSTSEC-2025-0141", reason = "bincode 3.0.0 is not a real upgrade; cache format depends on 2.0.1" },
]

[licenses]
version = 2
# Allow common non-restrictive licenses. Do not allow OpenSSL: we refuse the
# OpenSSL library itself, and we do not want `ring` (whose license includes
# "OpenSSL") sneaking back in next to aws-lc-rs.
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "Unicode-3.0",
    "Zlib"
]

[[licenses.clarify]]
name = "encoding_rs"
expression = "(MIT OR Apache-2.0) AND BSD-3-Clause AND CC0-1.0"
license-files = [{ path = "COPYRIGHT", hash = 972598577 }]

[bans]
# Warn about multiple versions of the same crate, unless we've indicated otherwise below.
multiple-versions = "warn"

deny = [
    # This never causes anything but portability misery.
    { name = "openssl" },
    { name = "openssl-sys" },
    { name = "native-tls" },
    # `serde_derive` shipped unreproducible binary builds for a while. See
    # https://github.com/serde-rs/serde/issues/2538.
    { name = "serde_derive", version = ">1.0.171,<1.0.184" },
]

#skip = [
#    # This seems to be included by portable-atomic 0.3.20 for some reason.
#    { name = "portable-atomic", version = "1.6.0" },
#]

skip-tree = [
    # This has a bunch of old dependencies.
    { name = "bigtable_rs" },
]
